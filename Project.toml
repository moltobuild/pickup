# Pickup's own manifest. Note what this file does NOT say — no compiler binary,
# no version. It states what the code needs; pickup's whole purpose is to turn
# that into a binary on each machine.
#
# This is what `molto build` and `molto test` read, so it has to describe the
# build completely: nothing falls back to the Makefile.

[package]
name = "pickup"
version = "0.11.0"
description = "The toolchain manager of the Molto ecosystem"
repository = "https://github.com/moltobuild/pickup"
# The key states a licence; LICENSE and NOTICE at the root grant it. Apache-2.0
# for the patent grant, and the same one molto carries: pickup downloads and
# runs other people's compilers, which is the risk worth naming.
license = "Apache-2.0"

[target]
std = "c2x"
requires = ["attr_nodiscard"]
# __USE_MINGW_ANSI_STDIO: mingw's default printf comes from msvcrt, which does
# not know `%z`. Pickup prints a size with it in nine files, and each one would
# come out as the literal letters on Windows. The macro asks mingw for its own
# conforming implementation, and it has to be set before <stdio.h> — which a
# define does and a #define in one file cannot. Nothing on Linux reads it.
#
# Here and not only in the Makefile because the Makefile is the bootstrap:
# `molto build` reads this file, and molto builds pickup for Windows today.
defines = ["_DEFAULT_SOURCE", "__USE_MINGW_ANSI_STDIO=1"]
include = ["include"]
flags = ["-Wall", "-Wextra", "-Wpedantic"]

[test]
# The suite registers its cases and moltest owns main(), so everything links
# into one executable.
mode = "single"

# Development dependencies come from molto's shared store, fetched once and
# reused by every project that names the same tag; the suite is built by molto,
# and the bootstrap Makefile hands `make test` over to it.
[dev-deps]
moltest = { git = "https://github.com/moltobuild/moltest", tag = "v0.3.0" }

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 3
debug_info = false

# What CI's sanitizers job builds: `molto test --profile custom`. Flags in a
# profile reach the compile and the link line, which the runtime needs.
[profile.custom]
opt_level = 0
debug_info = true
flags = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer"]
