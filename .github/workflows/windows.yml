name: Windows

# Deliberately not part of `ci.yml`.
#
# This file measures how far the Windows port has got; `ci.yml` is what has to
# be green. It is not a gate. Nothing requires it, and a pull request merges
# with it red — which is the whole reason it can afford to be red.
#
# The flag no longer sits on the jobs, and that is not tidying. A job marked
# `continue-on-error` reports success whatever happens inside it, so this
# workflow's badge was green over a tree where thirty cases fail — and a green
# badge that means nothing is worse than no badge, because someone believes it.
# The flag stays on the one step that is still being watched, which is what
# lets it measure rather than stop, and `Where the port stands` ends the job
# the way the port really is.
#
# When that step passes, the flag comes off and both jobs move into `ci.yml`.
# That move is the definition of "supported" in RFC-0017: a platform is not
# named as supported until the suite proves it, and pickup's own spec says
# naming one before it is proven is the single thing this project exists not
# to do.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Half one: does the code compile for Windows at all?
  #
  # Asked on a Linux runner with a cross compiler, because it needs no Windows
  # queue and no MSYS2 install — a minute against ten. It catches every missing
  # declaration and every struct field that differs, which is what stands
  # between here and a binary.
  #
  # Measured on 2026-08-28, before any of this was fixed: 28 errors across
  # `src/` and 55 across `tests/`, which are nine distinct problems and three.
  # Eleven of the source sites are one-line substitutions — `realpath` six
  # times, `lstat` twice, `st_mtim` twice, `mkdir`'s second argument once — and
  # every remaining one is inside `process_service.c`, where `fork` + `pipe` +
  # `dup2` + `waitpid` has to become `CreateProcess`. The suite's three are
  # `setenv`, `unsetenv` and `mkdtemp`.
  #
  # What this job cannot say anything about is how the binary behaves. That is
  # the whole reason half two exists.
  cross:
    name: Compiles for Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 gcc-mingw-w64-x86-64

      - name: Compile pickup for Windows
        run: make build CC=x86_64-w64-mingw32-gcc

      # Built and not run: these are Windows binaries on a Linux runner. Running
      # them is half two's job. Building them is still worth doing here, because
      # the suite has POSIX of its own — `setenv`, `unsetenv` and `mkdtemp` — and
      # a port whose tests cannot be compiled is a port that cannot be proven.
      - name: Compile its suite for Windows
        run: make build/pickup_tests CC=x86_64-w64-mingw32-gcc

      - name: And it really is a Windows binary
        run: file build/pickup* | grep -q 'PE32+ executable'

  # Half two: does the binary do pickup's job?
  #
  # It has to be a Windows runner, because the question is about behaviour and
  # no cross build can answer it.
  #
  # The smoke test is the point of this job and it is not ceremony. Pickup
  # answers "which compilers does this machine have" by walking PATH and
  # matching names, and on Windows every candidate is `clang.exe` rather than
  # `clang` — a suffix `scanner_is_candidate_name` does not accept. So a pickup
  # that compiles will start, run, report zero toolchains and exit 0.
  #
  # A job that only built would go green and hand over a binary that finds
  # nothing. That is worse than a compile error, because it looks like success.
  windows:
    name: Runs on Windows
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1

      # MSYS2 rather than the runner's own MinGW: it brings `make`, which the
      # bootstrap Makefile needs, and a gcc from the same family the cross job
      # compiles with, so the two halves disagree about as little as possible.
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      # `CC=gcc` because the bootstrap Makefile reaches for `gcc-12` when nobody
      # names a compiler, and MSYS2 calls its own `gcc`. The Makefile is right
      # to pin a version on the machine it was written for — pickup must not
      # need pickup to find a compiler — so the override belongs here.
      - name: Build
        run: make build CC=gcc

      # Before the suite, deliberately. A job that stops at the first failure
      # reports whatever it reached, and "does it find a compiler at all" is
      # the headline this job exists to answer — worth more, while the port is
      # in progress, than knowing which of two hundred cases went red.
      #
      # Not `pickup list` on its own: that exits 0 with an empty table, which is
      # exactly the failure this is here to catch. The assertion is that it
      # named something.
      - name: It finds the compiler this machine has
        run: |
          ./build/pickup --version
          ./build/pickup scan
          ./build/pickup list | tee found.txt
          grep -qE '^(gcc|clang|cc)' found.txt \
            || { echo "pickup found no toolchain on a machine that has one"; exit 1; }

      # `resolve` is the question molto actually asks. A pickup that lists a
      # compiler and then cannot answer for one is a pickup molto cannot use.
      - name: And it can answer molto's question
        run: ./build/pickup resolve --lang c

      # Watched, not gated, while the port is in progress — and the distinction
      # is deliberate. Around forty of the failures are one thing: seven test
      # files fabricate a fake compiler by writing `#!/bin/sh` and calling
      # chmod, and Windows has no shebang for CreateProcess to honour. That is
      # the harness being unable to make a program, not pickup being unable to
      # do its job, and `resolve` passing against a real gcc two steps above is
      # the evidence.
      #
      # Reported rather than skipped: skipping edits forty tests to hide them,
      # while this leaves every failure printed and counted, so the tally is a
      # number to watch move. The steps above stay hard gates, so a regression
      # in building, finding a compiler or resolving still turns this red.
      #
      # The flag comes off when the fakes are real programs. That, and the
      # job-level one, is what RFC-0017 means by supported.
      - name: Run the suite (watched, not yet a gate)
        continue-on-error: true
        run: |
          set +e
          make test CC=gcc 2>&1 | tee suite.log
          status=${PIPESTATUS[0]}
          failed=$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) failed.*/\1/p' suite.log | tail -1)
          if [ -n "$failed" ] && [ "$failed" -gt 0 ]; then
            echo "$failed" >> tally.count
            echo "### The suite on Windows" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$failed tests still fail." >> "$GITHUB_STEP_SUMMARY"
          elif [ $status -ne 0 ]; then
            # It failed without reporting a tally: the binary did not run, or
            # it died partway. Counted as one so the verdict cannot read that
            # as nothing wrong.
            echo 1 >> tally.count
          fi
          exit $status

      # The job ends the way the port stands. This step and the flag above come
      # off together, when the count reaches zero.
      - name: Where the port stands
        run: |
          if [ ! -f tally.count ]; then
            echo "the suite reported no tally, which is its own kind of red"
            exit 1
          fi
          total=$(awk '{ sum += $1 } END { print sum + 0 }' tally.count)
          echo "$total between here and a supported platform"
          test "$total" -eq 0
