name: Release

# A tag is what publishes. Nothing here runs on a branch, so a release is
# always something someone decided to make rather than something a merge did.
on:
  push:
    tags: ["v*"]

  # A rehearsal. `build` and `windows` run; `publish` does not, because there
  # is no tag to publish under. It exists because the only other way to find
  # out whether this file works is to spend a version number on it — and a tag
  # whose run fails is a tag that is already taken, which is how v0.7.2 was
  # lost. Everything up to and including running the binary on Windows can be
  # asked for on demand now, and the answer costs nothing.
  workflow_dispatch:

permissions:
  contents: write

# The toolchain that produces the Windows binary, pinned by version and by
# digest — and served by the registry pickup itself installs from, which makes
# this the one place where the project builds its own release with the supply
# chain it asks everyone else to use.
#
# Fetched with curl rather than with the pickup being released. `install` is
# pickup's largest command and the release must not depend on it: a regression
# there would mean the version that fixes it could not be published either.
# The circularity is not elegance, it is a trap.
#
# apt's `gcc-mingw-w64-x86-64` was the alternative and is the wrong one: it
# links against msvcrt, whose `printf` does not know `%z`, and it is several
# major versions behind. This is UCRT and LLVM 23.
env:
  MINGW_VERSION: "23.1.0"
  MINGW_SHA256: "a6a7812ee736f25345fec3842224b4c12cc795751ea2117f684f8ad59dc7022f"

jobs:
  build:
    name: Build what gets published
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install GCC 12
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12 zstd

      # The tag and the manifest are two claims about the same number, and a
      # binary whose version disagrees with the tag it was published under is
      # the one failure nobody notices until much later.
      # The manifest is the single source of the number, and every job below
      # reads it from here rather than from the ref — a rehearsal has a branch
      # name where a release has a tag, and the filenames must not care which.
      #
      # Under a tag the two are checked against each other. A binary whose
      # version disagrees with the tag it was published under is the one
      # failure nobody notices until much later. Same reasoning as
      # `cli_reports_the_version_the_manifest_declares`, one level up.
      - name: The version, and the tag if there is one
        id: version
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml | head -1)
          echo "manifest: $declared"
          echo "VERSION=$declared" >> "$GITHUB_ENV"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "a rehearsal: no tag for it to agree with"
            exit 0
          fi
          tagged=${GITHUB_REF_NAME#v}
          echo "tag:      $tagged"
          test "$declared" = "$tagged"

      # Static, so the artifact does not carry the runner's glibc with it. A
      # dynamic build needs GLIBC_2.34 and rules out Debian 11, Ubuntu 20.04
      # and RHEL 8 — the machines most likely to want a newer compiler than
      # they ship, which is the whole reason pickup exists.
      - name: Build the static Linux binary
        run: |
          make build LDFLAGS="-static"
          file build/pickup
          file build/pickup | grep -q 'statically linked'

      # The artifact itself is exercised, not a sibling of it: a static binary
      # that cannot probe a compiler is the failure this catches.
      - name: It answers about this machine
        run: |
          pickup="$PWD/build/pickup"
          test "$("$pickup" --version)" = "pickup ${VERSION}"
          "$pickup" scan
          "$pickup" list
          "$pickup" resolve --lang c --format toml

      - name: Fetch the Windows toolchain
        run: |
          url=https://registry.moltobuild.dev/v1/toolchains/llvm-mingw/${MINGW_VERSION}/linux-x86_64/download
          curl -fsSL --retry 3 -o llvm-mingw.tar.zst "$url"
          echo "${MINGW_SHA256}  llvm-mingw.tar.zst" | sha256sum --check --strict
          mkdir -p toolchain
          tar --zstd -xf llvm-mingw.tar.zst -C toolchain

      # A separate BUILD_DIR, because the objects above are ELF and these are
      # PE and they share every path. Make compares timestamps, not targets,
      # and one tree would hand the linker a mixture of the two.
      - name: Cross-compile the static Windows binary
        run: |
          driver="$PWD/toolchain/bin/x86_64-w64-mingw32-clang"
          test -x "$driver"
          make build BUILD_DIR=build-windows CC="$driver" LDFLAGS="-static"
          file build-windows/pickup.exe
          file build-windows/pickup.exe | grep -q 'PE32+ executable'

      # UCRT ships with Windows 10 and later, so a binary that imports only it
      # and KERNEL32 needs nothing unpacked beside it. Anything else in this
      # list — `libwinpthread-1.dll`, `libgcc_s_seh-1.dll`, `libc++.dll` — is a
      # file the download would have to carry and does not, which makes it a
      # binary that runs here and not on the machine it was published for.
      - name: And it needs nothing beside it
        run: |
          strings build-windows/pickup.exe \
            | grep -oiE '[A-Za-z0-9_-]+\.dll' | sort -u | tee imports
          ! grep -viE '^(api-ms-win-crt-[a-z0-9-]+\.dll|KERNEL32\.dll)$' imports

      - name: Name them, hash them, and describe them
        run: |
          mkdir -p dist
          cp build/pickup "dist/pickup-${VERSION}-x86_64-linux"
          cp build-windows/pickup.exe "dist/pickup-${VERSION}-x86_64-windows.exe"
          cd dist
          sha256sum pickup-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        run: |
          cat > dist/NOTES.md <<NOTES
          ### Linux

          Static x86-64 binary. No glibc requirement, nothing to unpack.

          \`\`\`sh
          base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}
          curl -fsSLO \$base/pickup-${VERSION}-x86_64-linux
          curl -fsSLO \$base/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          chmod +x pickup-${VERSION}-x86_64-linux
          sudo install pickup-${VERSION}-x86_64-linux /usr/local/bin/pickup
          \`\`\`

          Then ask it what this machine already has, or fetch a toolchain:

          \`\`\`sh
          pickup list
          pickup install clang
          \`\`\`

          Everything installs under \`~/.pickup\`, no root. Needs \`curl\`, \`tar\` and
          \`zstd\` on the PATH to install anything; \`pickup doctor\` says so when one
          is missing.

          ### Windows

          \`pickup-${VERSION}-x86_64-windows.exe\`, x86-64, Windows 10 or later.
          Statically linked against UCRT: there is nothing to put beside it.

          **Windows is not a supported platform yet, and this binary does not
          claim it is.** RFC-0017 sets four bars for that word and the fourth —
          the full suite green on a Windows runner — is not met. What is
          measured to work, in CI, on a Windows runner, and asserted against
          this exact binary before it is published:

          - \`scan\` and \`list\` find the compiler the machine has
          - \`resolve --lang c\`, which is the question molto actually asks

          What is not proven there: **\`install\`**. Windows ships \`curl.exe\` and
          \`tar.exe\` but no \`zstd\`, and the archives are zstd — so unpacking has
          nothing to unpack with until one is on the PATH. Use \`pickup\` on
          Windows to find and answer for a compiler that is already installed;
          for fetching one, the supported path is still Linux.

          The state of the port is the Windows badge on the README.
          NOTES
          cat dist/NOTES.md

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  # A cross build says the binary is well-formed. It cannot say the binary does
  # pickup's job, and this port is the reason that sentence is in both
  # repositories: it compiled, it linked, it started, and it reported zero
  # toolchains on a machine with a compiler — because every candidate is
  # `gcc.exe` and `PATH` splits on `;`. Nothing before this job can see that.
  windows:
    name: The Windows binary does pickup's job
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist

      # MSYS2 is here for the compiler it brings, not for the shell: nothing in
      # this job builds pickup, it runs the binary the last one produced. The
      # compiler is the subject — a pickup that finds nothing on a machine with
      # a gcc on it is the failure this job exists to catch.
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: The download is the file that was hashed
        run: sha256sum --check --ignore-missing SHA256SUMS

      # Not `list` on its own: that exits 0 with an empty table, which is
      # exactly the failure this is here to catch. The assertion is that it
      # named something.
      - name: It finds the compiler this machine has
        run: |
          pickup="$PWD/pickup-${VERSION}-x86_64-windows.exe"
          chmod +x "$pickup"
          test "$("$pickup" --version)" = "pickup ${VERSION}"
          "$pickup" scan
          "$pickup" list | tee found.txt
          grep -qE '^(gcc|clang|cc)' found.txt \
            || { echo "pickup found no toolchain on a machine that has one"; exit 1; }

      # `resolve` is the question molto actually asks. A pickup that lists a
      # compiler and then cannot answer for one is a pickup molto cannot use.
      - name: And it can answer molto's question
        run: |
          "$PWD/pickup-${VERSION}-x86_64-windows.exe" resolve --lang c

  # A tag is what publishes. A rehearsal proves everything above this line and
  # then stops, which is the whole point of it.
  publish:
    name: Publish
    needs: [build, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "pickup ${VERSION}" \
            --notes-file dist/NOTES.md \
            --generate-notes \
            "dist/pickup-${VERSION}-x86_64-linux" \
            "dist/pickup-${VERSION}-x86_64-windows.exe" \
            dist/SHA256SUMS
