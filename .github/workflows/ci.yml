name: Linux

on:
  push:
    branches: [main, master]
  pull_request:

# A push that supersedes another cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  # The tree is formatted and analysed by LLVM 19, the version pickup itself
  # installs here. A different major disagrees about line breaking, and a
  # formatting gate that disagrees with the working copy is worse than none.
  LLVM_VERSION: "19"
  # Pickup is built and tested by a published molto, the one named in
  # .github/molto-version (install-molto.sh says why it is pinned).

jobs:
  # Pickup answers "which compilers does this machine have", so its suite wants
  # a machine with compilers on it. Two GCCs, because several tests are about
  # telling versions apart rather than about finding one.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install two GCCs
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12 gcc-13 g++-13
      - run: make build
      # The suite is built by molto (the Makefile hands `test` over), with its
      # test framework from molto's store.
      - name: Take molto from its release
        run: ./.github/install-molto.sh x86_64-linux sha256sum
      - name: make test
        env:
          C_COMPILER: gcc-12
          CPP_COMPILER: g++-12
        run: make test

  # Nothing that ships should warn, under either compiler, at either level.
  # -O3 is not redundant: GCC's truncation and use-after-free analyses need
  # value-range propagation and say nothing at -O0.
  warnings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-12, clang]
        opt: ["-O0", "-O3"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GCC 12
        run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12
      - name: Install Clang ${{ env.LLVM_VERSION }}
        if: matrix.compiler == 'clang'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get install -y -o Acquire::Retries=3 clang-${LLVM_VERSION}
      - name: Build with -Werror
        run: |
          cc=${{ matrix.compiler }}
          [ "$cc" = clang ] && cc=clang-${LLVM_VERSION}
          make build CC="$cc" EXTRA_CFLAGS="-Werror ${{ matrix.opt }}"

  # Pickup is built by molto, the same way molto is. The bootstrap Makefile
  # exists because the first pickup has to be compiled by something that does
  # not need pickup to find a compiler — it is not the supported path.
  #
  # The molto used here is the published static binary, checksum-verified —
  # which is both what a user runs and the only version of molto whose
  # behaviour is fixed.
  built-by-molto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GCC 12
        run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12
      - name: Take molto from its release
        run: ./.github/install-molto.sh x86_64-linux sha256sum
      # The suite runs in `test`, by this same molto; here it builds what ships.
      - name: molto builds pickup
        env:
          C_COMPILER: gcc-12
          CPP_COMPILER: g++-12
        run: molto build

  # What molto says about pickup's own source. Same molto, same reason.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GCC 12 and LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12 \
            clang-format-${LLVM_VERSION} clang-tidy-${LLVM_VERSION}
      - name: Take molto from its release
        run: ./.github/install-molto.sh x86_64-linux sha256sum
      - name: molto fmt --check
        env:
          C_COMPILER: gcc-12
          MOLTO_CLANG_FORMAT: /usr/bin/clang-format-19
        run: molto fmt --check
      - name: molto lint
        env:
          C_COMPILER: gcc-12
          MOLTO_CLANG_TIDY: /usr/bin/clang-tidy-19
        run: molto lint

  # The shape the release ships, built on every push rather than only at a tag.
  # Static glibc is safe here for the same reason it is in molto: pickup shells
  # out to curl and tar and never resolves a hostname itself, so no NSS is
  # linked in. A build that started doing its own networking would link cleanly
  # and fail on a machine other than this one.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GCC 12
        run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12
      - name: Link it statically
        run: |
          make build LDFLAGS="-static"
          file build/pickup | grep -q 'statically linked'
      - name: And it still answers about this machine
        run: |
          ./build/pickup --version
          ./build/pickup scan
          ./build/pickup list
          ./build/pickup resolve --lang c

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GCC 12
        run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 gcc-12 g++-12
      - name: Take molto from its release
        run: ./.github/install-molto.sh x86_64-linux sha256sum
      # The suite is built by molto, so the sanitizers are a molto profile:
      # Project.toml's [profile.custom], whose flags reach the compile and the
      # link line alike. Compile and link both matter: -fsanitize on the link
      # alone links the runtime and instruments nothing.
      - name: Address and undefined behaviour
        env:
          C_COMPILER: gcc-12
          CPP_COMPILER: g++-12
        run: molto test --profile custom
